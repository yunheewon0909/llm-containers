name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    container_name: hermes

    restart: unless-stopped

    command: gateway run

    ports:
      - "127.0.0.1:8642:8642"

    volumes:
      - hermes-data:/opt/data

volumes:
  hermes-data:
    name: hermes-data