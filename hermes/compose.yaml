name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    container_name: hermes

    restart: unless-stopped

    command: gateway run

    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

    volumes:
      - hermes-data:/opt/data

    environment:
      HERMES_DASHBOARD: "1"

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hermes-data:
    name: hermes-data