name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-latest}
    container_name: hermes

    restart: unless-stopped

    command: gateway run

    ports:
      - "127.0.0.1:8642:8642"

    volumes:
      - hermes-data:/opt/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - local-ai-network

volumes:
  hermes-data:
    name: hermes-data

networks:
  local-ai-network:
    external: true